{%- comment -%}
Styling for the About page. Extracted from about.md's formerly-inline <style> block
so about.md and da/about.md — the only genuinely duplicated prose pages — share one
copy and cannot drift apart.
{%- endcomment -%}
<style>
.about-quote {
  text-align: center;
  padding: 1.6em 2em;
  background: rgba(56, 189, 248, 0.04);
  border: 1px solid rgba(56, 189, 248, 0.15);
  border-radius: 8px;
  /* Closes the page rather than opening it, so it needs no gap beneath. */
  margin: 0.5em 0 0;
  position: relative;
}

.about-quote::before {
  content: "\201C";
  display: block;
  font-size: 2.6em;
  line-height: 0.5;
  color: rgba(56, 189, 248, 0.55);
  margin-bottom: 0.25em;
  font-family: Georgia, serif;
}

.about-quote p {
  font-size: 1.08em;
  font-style: italic;
  color: #cfdce7;
  margin: 0;
  line-height: 1.7;
  text-align: center;
}

.about-row {
  display: grid;
  grid-template-columns: 1fr 230px;
  gap: 2.5em;
  align-items: center;
  margin: 0 0 2.5em;
}

.about-row.reverse {
  grid-template-columns: 200px 1fr;
}

.about-row figure {
  margin: 0;
}

.about-row img {
  display: block;
  width: 100%;
  margin: 0;
  border-radius: 8px;
  border: 1px solid rgba(56, 189, 248, 0.18);
  transition: border-color 0.2s, box-shadow 0.2s;
}

.about-row img:hover {
  border-color: rgba(56, 189, 248, 0.45);
  box-shadow: 0 0 16px rgba(56, 189, 248, 0.1);
}

.about-text {
  line-height: 1.75;
  color: #cfdce7;
}

/* Full-width lead-in above the image rows, for prose that carries no picture. */
.about-intro {
  line-height: 1.75;
  color: #cfdce7;
  margin: 0 0 2.5em;
}

/* Both blocks used to hold one unbroken run of text; now they hold real
   paragraphs, which the page's base <p> rules do not reach inside a raw HTML
   block. */
.about-intro p,
.about-text p {
  margin: 0 0 1em;
}

.about-intro p:last-child,
.about-text p:last-child {
  margin-bottom: 0;
}

.about-intro strong {
  color: #38bdf8;
  font-weight: 600;
}

@media (max-width: 700px) {
  .about-row,
  .about-row.reverse {
    grid-template-columns: 1fr;
    gap: 1.5em;
  }
  .about-row .about-text {
    order: 1;
  }
  .about-row figure {
    order: 2;
    max-width: 240px;
    margin: 0 auto;
  }
}
</style>
