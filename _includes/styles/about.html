{%- comment -%}
Styling for the About page. Extracted from about.md's formerly-inline <style> block
so about.md and da/about.md — the only genuinely duplicated prose pages — share one
copy and cannot drift apart.
{%- endcomment -%}
<style>
/* --- Hero → prose hinge --------------------------------------------------- */

/* .thought-caption's own rule lives in thought-hero.html, which loads AFTER this
   sheet; the extra class wins on specificity rather than order, so the hero
   include stays untouched. Tightened because .about-break now does the
   separating — the gap no longer has to carry it alone. */
.thought-hero .thought-caption {
  margin-bottom: 1.7em;
}

/* Closes the centred hero unit. Fades at both ends so it reads as the end of a
   centred block rather than a table rule. */
.about-break {
  border: none;
  height: 1px;
  margin: 0 0 2.4em;
  background: linear-gradient(to right,
    rgba(56, 189, 248, 0)    0%,
    rgba(56, 189, 248, 0.32) 50%,
    rgba(56, 189, 248, 0)    100%);
}

/* --- Opening lead --------------------------------------------------------- */

/* The page's first words: who I am, what this site is. Deliberately unadorned —
   no rule, no label — so the Prelude below reads as a distinct movement rather
   than a continuation of the same thought. */
.about-lead {
  font-size: 1.05em;
  line-height: 1.7;
  color: #dbe6ef;
  margin: 0 0 3em;
}

/* --- Prelude -------------------------------------------------------------- */

/* The page's thesis, so it carries more weight than the prose below it. It no
   longer opens the page, so it has to announce itself: the label names it and
   the left rule brackets it. That rule is the same gradient-as-rule idiom as
   .home-section-label in styles/cv-list.html, rotated to run down the edge and
   fade out as the block ends. */
.about-prelude {
  font-size: 1.05em;
  line-height: 1.7;
  color: #dbe6ef;
  margin: 0 0 2.8em;
  padding-left: 1.5em;
  background: linear-gradient(to bottom,
    rgba(56, 189, 248, 0.5),
    rgba(56, 189, 248, 0.06)) no-repeat left / 2px 100%;
}

/* Mono, cyan and letterspaced — the same label voice as .home-section-label and
   .about-quote cite. Sized from scratch because the page's default <h2> is far
   too loud for a one-word marker. No underline: the left rule already does the
   bracketing, and both at once reads busy. */
.about-label {
  font-family: "JetBrains Mono", monospace;
  font-size: 0.76em;
  font-weight: 500;
  color: rgba(125, 211, 252, 0.95);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin: 0 0 1em;
  line-height: 1.4;
}

/* Both blocks hold real paragraphs, which the page's base <p> rules do not reach
   inside a raw HTML block. The gap is deliberately under one line: every
   paragraph here is a single sentence, and a full line of air made them read as
   a list. */
.about-lead p,
.about-prelude p {
  margin: 0 0 0.6em;
}

.about-lead p:last-child,
.about-prelude p:last-child {
  margin-bottom: 0;
}

/* --- Figure pair ---------------------------------------------------------- */

/* The caption, not the image, sets the column width here: these captions run to
   several sentences, and a column sized to the 240px image would break that
   prose at roughly 35 characters a line. So each figure takes an equal share of
   the measure and the image is capped and centred inside it. The cap matters —
   mig_mat.png is only 279px wide and would upscale into mush at half the 48em
   column. */
.about-figures {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  gap: 2.4em;
  margin: 0 0 2.6em;
}

.about-figures figure {
  flex: 1 1 0;
  min-width: 0;
  margin: 0;
}

.about-figures img {
  display: block;
  width: 100%;
  max-width: 240px;
  height: auto;
  margin: 0 auto;
  border-radius: 8px;
  border: 1px solid rgba(56, 189, 248, 0.18);
  transition: border-color 0.2s, box-shadow 0.2s;
}

.about-figures img:hover {
  border-color: rgba(56, 189, 248, 0.45);
  box-shadow: 0 0 16px rgba(56, 189, 248, 0.1);
}

/* One caption per image rather than one caption for the pair, which is what lets
   the layout flip from side-by-side to stacked without the text having to say
   "left" or "top". Deliberately NOT the mono label voice of .posts-images
   figcaption: these carry real prose, and centred letterspaced mono is unreadable
   at paragraph length. Dimmer than the prose above so the pair still reads as
   subordinate to it. */
.about-figures figcaption {
  font-size: 0.92em;
  line-height: 1.65;
  color: rgba(196, 212, 224, 0.85);
  margin-top: 0.9em;
}

/* figcaption sits outside the .about-lead/.about-prelude selector above, so
   these paragraphs would otherwise take the browser's 1em default and open a
   full line of air between single sentences. */
.about-figures figcaption p {
  margin: 0 0 0.5em;
}

.about-figures figcaption p:last-child {
  margin-bottom: 0;
}

/* --- Closing quote -------------------------------------------------------- */

.about-quote {
  text-align: center;
  padding: 1.6em 2em;
  background: rgba(56, 189, 248, 0.04);
  border: 1px solid rgba(56, 189, 248, 0.15);
  border-radius: 8px;
  /* Closes the page rather than opening it, so it needs no gap beneath. */
  margin: 0.5em 0 0;
  position: relative;
}

.about-quote::before {
  content: "\201C";
  display: block;
  font-size: 2.6em;
  line-height: 0.5;
  color: rgba(56, 189, 248, 0.55);
  margin-bottom: 0.25em;
  font-family: Georgia, serif;
}

.about-quote p {
  font-size: 1.08em;
  font-style: italic;
  color: #cfdce7;
  margin: 0;
  line-height: 1.7;
  text-align: center;
}

/* Mono, cyan and letterspaced like .cv-year and .posts-images figcaption, so the
   attribution reads in the site's existing voice. */
.about-quote cite {
  display: block;
  margin-top: 0.9em;
  font-family: "JetBrains Mono", monospace;
  font-size: 0.8em;
  font-style: normal;
  letter-spacing: 0.06em;
  color: rgba(125, 211, 252, 0.9);
}

@media (max-width: 700px) {
  /* Side by side, the pair would leave each caption under ~140px of measure. */
  .about-figures {
    flex-direction: column;
    align-items: stretch;
    gap: 2.4em;
  }

  /* Full width so the caption keeps a readable measure; the image stays capped
     and centred by its own max-width. */
  .about-figures figure {
    flex: 0 1 auto;
    width: 100%;
  }

  /* The left rule would eat too much of a narrow measure at full size. */
  .about-prelude {
    font-size: 1.02em;
    padding-left: 1.1em;
  }
}
</style>
