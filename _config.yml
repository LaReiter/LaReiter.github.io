title: "Lars Nørtoft Reiter"
author:  "Lars Nørtoft Reiter"
description: "<i>AI. Statistics. Philosophy.</i>"
tagline: "Statistician &amp; Physicist"
permalink: /:title/
lang: "en"
excerpt_separator: "\n\n\n"
date_format: "%B %d, %Y"

# Layout

show_excerpts: false        # show article excerpts on the home page
show_frame: true           # adds a gray frame to the site
show_sidebar: true        # show a sidebar instead of the usual header
minimal: false             # use a dark header

# Menu

# Entries are keyed by `ref`, not by filename: each nav item resolves to the page
# whose front matter has a matching `ref` AND a `lang` equal to the current page's
# language. Filename lookup cannot work here — da/about.md and about.md share the
# name "about.md" and would collide. Titles come from each page's own front matter,
# so translations live with the page. Also accepts {title, url, icon} for external links.
navigation:
 - {ref: about,    icon: user}
 - {ref: cv,       icon: file-alt}
 - {ref: media,    icon: newspaper}
 - {ref: blog,     icon: feather-alt}
 - {ref: projects, icon: lightbulb}
 - {ref: thoughts, icon: comment}

external:                  # shows a footer with social links - for available icons see fontawesome.com/icons
  - {title: Mail, icon: envelope, url: "mailto:lars.reiter.nielsen@gmail.com"}
  - {title: Github, icon: github, url: "https://github.com/LaReiter"}
  - {title: Linkedin, icon: linkedin, url: "https://www.linkedin.com/in/lars-n%C3%B8rtoft-reiter-01646099/"}

comments:
#  disqus_shortname: ""    # see https://disqus.com/
#  isso_domain: ""         # see https://posativ.org/isso/

plugins:
 - jekyll-feed

collections:
  projects:
    output: true
    permalink: /projects/:name/
