<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
{%- comment -%}
One symbol per icon named in _config.yml, taken straight from the Font Awesome
data. An icon with no Font Awesome equivalent finds nothing here and is written
out by hand below instead.
{%- endcomment -%}
{% assign keys = 'navigation,external' | split: ',' %}
{% for key in keys %}
{% for link in site[key] %}
  {% assign icon = link.icon %}
  {% assign svg = site.data.font-awesome.icons[icon].svg | first %}
  {% if svg %}
  <symbol id="{{ icon }}" viewBox="0 0 {{ svg[1].width }} {{ svg[1].height }}"><path d="{{ svg[1].path }}" /></symbol>
  {% endif %}
{% endfor %}
{% endfor %}

<!--
Google Scholar is not part of Font Awesome Free, so the loop above finds nothing
for it and the mark is spelled out here instead. Any other icon missing from the
Font Awesome set can be added the same way: give the link an `icon:` in
_config.yml that matches a symbol id below. Like the generated ones it carries no
fill of its own, so it takes the surrounding text colour.
Source: Simple Icons (CC0) - https://simpleicons.org/?q=google+scholar
-->
  <symbol id="google-scholar" viewBox="0 0 24 24"><path d="M5.242 13.769L0 9.5 12 0l12 9.5-5.242 4.269C17.548 11.249 14.978 9.5 12 9.5c-2.977 0-5.548 1.748-6.758 4.269zM12 10a7 7 0 1 0 0 14 7 7 0 0 0 0-14z" /></symbol>
</svg>
