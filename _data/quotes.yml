- en: "We learn from what we observe. But what we observe is painted by what we learned."
  da: "Vi lærer af det vi ser. Men det vi ser er farvet af det, som vi har lært."

- en: "We all believe so strongly in our concept of reality, that we are completely oblivious to the illusion that it presents."
  da: "Vi lever os så meget ind i vores egen virkelighed, at vi bliver blinde over for den illusion, den faktisk er."

- en: "A principle that makes all disagreement subjective cannot survive disagreement about itself."
  da: "Et princip, der gør al uenighed til subjektivitet, kan ikke overleve uenighed om sig selv."

- en: "Saying you are right based on your credentials is like saying you are right because of your cool hat."
  da: "At sige man har ret baseret på hvad man har præsteret er som at sige at man har ret fordi man har den sejeste hat."

- en: "Prediction is hard. Hindsight is easy. Confusing past and present makes life look predictable."
  da: "Forudsigelser er svære. Bagklogskab er let. At forveksle fortid og nutid får livet til at fremstå forudsigeligt."

- en: "We like to think we weigh the argument. Mostly we weigh the person making it."
  da: "Vi bilder os ind, at vi vejer argumentet. For det meste vejer vi den, der fremfører det."

- en: "As we grow older, we question less and assume more. A child's curiosity can remind us just how little we know."
  da: "Når vi bliver ældre, stiller vi færre spørgsmål og antager mere. Et barns nysgerrighed kan få os til at indse, præcis hvor lidt vi faktisk ved."

- en: "Sometimes the big things leave you empty and the small things leave you full."
  da: "Nogle gange er det de store ting der dræner os, og de små ting der fylder os op."

- en: "When the 'I' in 'what I do' matters more than the 'what', it is time to ask why you do it."
  da: "Når 'jeg' i 'hvad jeg laver' betyder mere end 'hvad', er det tid til at spørge, hvorfor du gør, som du gør."

- en: "P-values are subject to Goodhart's law. Once significance became the target, they stopped measuring evidence."
  da: "P-værdier er underlagt Goodharts lov. Da signifikans blev målet, holdt de op med at måle evidens."

- en: "Diagnosis is unreliable because clinicians disagree with each other, disagree with themselves, meet patients who differ from day to day, and change what they measure by measuring it."
  da: "Diagnostik er upålidelig, fordi klinikere er uenige med hinanden, er uenige med sig selv, møder patienter, der varierer fra dag til dag, og ændrer det, de måler, ved at måle det."

- en: "I am convinced that an average person is quite different from everyone else."
  da: "Jeg er overbevist om, at en gennemsnitlig person er ganske forskellig fra alle andre."

- en: "Our own storytelling is the biggest threat to understanding reality."
  da: "Vores eget narrativ er den største trussel mod at forstå virkeligheden."

- en: "We should clean our glasses daily, otherwise we end up seeing the world through smudge."
  da: "Vi skal rengøre vores briller dagligt, ellers ender vi med at se verden gennem skidtet."