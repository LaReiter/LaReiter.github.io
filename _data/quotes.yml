- en: "We all fool ourselves, but few of us know we're the fool."
  da: "De fleste lyver over for sig selv, men kun få af os ved, at vi faktisk gør det."

- en: "We all believe so strongly in our concept of reality, that we are completely oblivious to the illusion that it presents."
  da: "Vi lever os så meget ind i vores egen virkelighed, at vi bliver blinde over for den illusion, den faktisk er."

- en: "You can't be successful until you define success."
  da: "Du kan ikke blive succesfuld, før du definerer succes."

- en: "What happens when there is nothing left to criticize? What will the critics do?"
  da: "Hvad gør kritikerne, når der ikke er noget tilbage at kritisere?"

- en: "If one person believes one thing, and another believes another thing, this isn't evidence that the subject is open to interpretation. It is evidence that we perceive it as such."
  da: "Hvis én person mener ét og en anden person noget andet, så er det ikke bevis for at emnet er op til fortolkning. Det er et bevis for at vi opfatter det sådan."

- en: "Saying you are right based on your credentials is like saying you are right because of your cool hat."
  da: "At sige man har ret baseret på hvad man har præsteret er som at sige at man har ret fordi man har den sejeste hat."

- en: "Suffering is the price of caring."
  da: "Lidelse er prisen for at føle noget."

- en: "We often know what to do, but choose not to."
  da: "Vi ved ofte hvad vi skal gøre, men vælger ikke at gøre det."

- en: "Predicting 'something' before it happens can be hard. Predicting that same 'something' in hindsight is always easy. When we look back, life therefore appears predictable."
  da: "At forudsige 'noget' før det sker kan være svært. At forudsige det samme 'noget' i bagklogskabens lys er altid nemt. Når vi kigger tilbage, fremstår livet derfor helt forudsigeligt."

- en: "The outer world is largely the same, when your inner world changes"
  da: "Verden udenfor er ganske uforandret, når din indre verden ændrer sig."

- en: "Life is made up of chapters, each of which we can manage. It is the transitions that we struggle with."
  da: "Livet består af kapitler, der hver for sig er tålelige. Det er overgangene vi kæmper med."

- en: "For many, the inclination to agree depends largely on who said it, and how it was said, more than what was said."
  da: "For mange, vil tilbøjeligheden til at gøre sig enige afhænge af, hvem der sagde det, og hvordan det blev sagt, snarere end hvad der blev sagt."

- en: "As we grow older, we question less and assume more. Sometimes, all it takes is a child's curiosity to remind us just how little we know."
  da: "Når vi bliver ældre, stiller vi færre spørgsmål og antager mere. Nogle gange kræver det blot et barns nysgerrighed at indse, præcis hvor lidt vi faktisk ved."

- en: "Sometimes the big things leave you empty, and the small things leave you full."
  da: "Nogle gange er det de store ting der dræner os, og de små ting der fylder os op."

- en: "Too little imagination makes the world hard to live in. Too much makes it hard to understand."
  da: "Med for lidt fantasi bliver verden svær at leve i. Med for meget bliver den svær at forstå."

- en: "When the 'I' in 'what I do' becomes more important than the 'what', you need to ask why you do what you do."
  da: "Når 'jeg' i 'hvad jeg laver' bliver vigtigere end 'hvad', bør du spørge dig selv hvorfor du gør, som du gør."

- en: "When any measure simultaneously leads to individual loss or gain, the measure becomes biased."
  da: "Når et måltal (KPI) samtidig medfører personlig tab eller gevinst, bliver måltallet biased."